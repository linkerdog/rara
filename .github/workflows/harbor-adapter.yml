name: harbor-adapter

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  harbor-adapter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harbor-version: ["0.20.0", "0.22.0"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Harbor
        run: |
          python -m pip install --upgrade pip
          python -m pip install "harbor==${{ matrix.harbor-version }}"

      - name: Run Harbor adapter tests
        run: |
          PYTHONPATH=$PWD/tools/harbor python -m unittest \
            tools.harbor.test_rara_agent \
            tools.harbor.test_rara_agent_prompts \
            tools.harbor.test_rara_agent_trajectory

  exec-cli:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-02

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run exec CLI tests
        run: cargo test --locked app_cli::tests
