name: test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler bubblewrap

      - name: Verify grader sandbox
        run: |
          if ! bwrap --unshare-all --ro-bind / / -- /usr/bin/true; then
            sudo apparmor_parser -r tools/prefix_cache_eval/ci-bwrap.apparmor
          fi
          python3 tools/prefix_cache_eval/run.py preflight

      - name: Calibrate isolated cache trial graders
        run: python3 -m unittest discover -s tools/prefix_cache_eval -p 'test_*.py'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-02

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked
