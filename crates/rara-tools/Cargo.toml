[package]
name = "rara-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rara-core = { path = "../rara-core" }
rara-tool-macros = { path = "../tool-macros" }
rara-apply-patch = { path = "../rara-apply-patch" }
rara-file-search = { path = "../file-search" }
rara-memory = { path = "../rara-memory" }
anyhow.workspace = true
async-trait.workspace = true
glob = "0.3"
log = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
walkdir = "2.5"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile.workspace = true

# Grandfathered legacy lints via source-level #![allow]; remove as cleaned (issue #871).
[lints]
workspace = true
