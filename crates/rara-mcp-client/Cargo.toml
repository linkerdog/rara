[package]
name = "rara-mcp-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "system-proxy"] }
rmcp = { workspace = true, features = [
    "reqwest",
    "transport-streamable-http-client-reqwest",
] }
serde_json.workspace = true
tokio = { version = "1.0", features = ["io-util", "process", "time"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1.0", features = ["io-util", "macros", "net", "rt-multi-thread"] }

[lints]
workspace = true
